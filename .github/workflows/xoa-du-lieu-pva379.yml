# XOÁ DỮ LIỆU app PVA-379 (/pva379) → SỔ MỚI — chạy TAY khi D bảo (tab Actions → Run workflow, hoặc Claude gọi).
# Ô "xacnhan" phải gõ đúng XOA mới xoá thật; để trống = chạy thử (chỉ đếm, in số lượng).
# Xoá phần giao dịch (phiếu, ảnh, chat, sổ quỹ, tạm ứng, thùng rác, mốc + số dư đầu kỳ); GIỮ tài khoản đăng nhập/vai,
# danh sách tài khoản ngân hàng, công trình, người đề xuất, nhân viên, cài đặt Sheet. KHÔNG đụng /duyetchi hay Gia Bình.
# Chìa khoá: dùng lại FIREBASE_TOKEN (hoặc FIREBASE_SERVICE_ACCOUNT) đã có trong GitHub Secrets.
name: Xoa du lieu PVA-379 (so moi)

on:
  workflow_dispatch:
    inputs:
      xacnhan:
        description: 'Gõ XOA để xoá thật (phiếu, sổ quỹ, chat, ảnh… của pva379). Để trống = chạy thử, chỉ đếm.'
        required: false
        default: ''

concurrency:
  group: xoa-du-lieu-pva379
  cancel-in-progress: false

jobs:
  xoa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cai firebase-tools
        run: npm install -g firebase-tools@13

      - name: Kiem tra da co chia khoa chua
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ] && [ "$HAS_SA" != "true" ]; then
            echo "::error::Chua co chia khoa FIREBASE_TOKEN (lay bang LAY-KHOA-TU-DONG.bat) trong GitHub → Settings → Secrets → Actions."
            exit 1
          fi

      - name: Xoa du lieu
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          XACNHAN: ${{ github.event.inputs.xacnhan }}
        run: |
          if [ "$HAS_SA" = "true" ]; then
            printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
            unset FIREBASE_TOKEN
          fi
          if [ "$XACNHAN" = "XOA" ]; then
            node scripts/xoa-du-lieu-pva379.js --xoa
          else
            echo "Chua go XOA → chi chay thu (dem, khong xoa)."
            node scripts/xoa-du-lieu-pva379.js
          fi
          rm -f "$RUNNER_TEMP/sa.json"
