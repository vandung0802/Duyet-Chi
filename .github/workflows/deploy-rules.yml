# TỰ ĐỘNG đưa luật Firebase (database.rules.json) lên máy chủ mỗi khi file này đổi trên nhánh main.
# Chìa khoá nằm trong GitHub Secrets (Settings → Secrets and variables → Actions), KHÔNG nằm trong repo:
#   - FIREBASE_TOKEN            : lấy bằng LAY-KHOA-TU-DONG.bat (firebase login:ci)   ← cách dễ nhất cho D
#   - hoặc FIREBASE_SERVICE_ACCOUNT : nội dung file JSON "Generate new private key" trong Firebase Console
# Chưa có chìa khoá thì tác vụ này báo đỏ và KHÔNG làm gì khác — app vẫn chạy như cũ.
name: Dua luat Firebase len may chu

on:
  push:
    branches: [main]
    paths: [database.rules.json, .github/workflows/deploy-rules.yml]
  workflow_dispatch:

concurrency:
  group: deploy-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cai firebase-tools
        run: npm install -g firebase-tools

      - name: Kiem tra da co chia khoa chua
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ] && [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Chua co chia khoa. Vao GitHub → Settings → Secrets and variables → Actions → New repository secret, ten FIREBASE_TOKEN (lay bang LAY-KHOA-TU-DONG.bat)."
            exit 1
          fi

      - name: Deploy luat database (dung service account neu co)
        if: ${{ env.HAS_SA == 'true' }}
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          firebase deploy --only database --project duyetchi-pva379 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Deploy luat database (dung FIREBASE_TOKEN)
        if: ${{ env.HAS_SA != 'true' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only database --project duyetchi-pva379 --non-interactive --token "$FIREBASE_TOKEN"
