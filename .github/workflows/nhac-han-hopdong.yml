# NHẮC HẠN app Hợp đồng PVA-379-279: mỗi sáng 07:00 giờ Việt Nam (= 00:00 UTC) chạy scripts/nhac-han-hopdong.js
# → đồng bộ mốc nhắc, gửi thông báo đẩy tới máy đã bật thông báo trong app. KHÔNG có việc thì KHÔNG gửi gì.
# Chìa khoá: dùng lại FIREBASE_TOKEN (hoặc FIREBASE_SERVICE_ACCOUNT) đã có trong GitHub Secrets — không cần thêm gì.
# Chạy tay để thử: tab Actions → "Nhac han Hop dong" → Run workflow (tích "chạy thử" thì chỉ in ra, không gửi).
name: Nhac han Hop dong

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      thu:
        description: 'Chạy thử (chỉ in ra, không ghi, không gửi)'
        type: boolean
        default: false

concurrency:
  group: nhac-han-hopdong
  cancel-in-progress: false

jobs:
  nhac:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cai firebase-tools va web-push
        run: |
          npm install -g firebase-tools
          npm install --prefix scripts --no-audit --no-fund

      - name: Kiem tra da co chia khoa chua
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ] && [ "$HAS_SA" != "true" ]; then
            echo "::error::Chua co chia khoa FIREBASE_TOKEN (lay bang LAY-KHOA-TU-DONG.bat) trong GitHub → Settings → Secrets → Actions."
            exit 1
          fi

      - name: Chay nhac han
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          THU: ${{ github.event.inputs.thu }}
        run: |
          if [ "$HAS_SA" = "true" ]; then
            printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
            unset FIREBASE_TOKEN
          fi
          if [ "$THU" = "true" ]; then node scripts/nhac-han-hopdong.js --thu; else node scripts/nhac-han-hopdong.js; fi
          rm -f "$RUNNER_TEMP/sa.json"
