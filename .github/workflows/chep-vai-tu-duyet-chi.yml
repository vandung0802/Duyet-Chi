# CHÉP DANH SÁCH TÀI KHOẢN (vai) từ app Duyệt Chi sang PVA-379 — chạy TAY khi D bảo. Không chép phiếu / sổ quỹ.
# Ô "xacnhan" gõ CHEP mới ghi; để trống = chạy thử, chỉ đếm. Nhật ký không in tên / email.
name: Chep tai khoan Duyet Chi sang PVA-379

on:
  workflow_dispatch:
    inputs:
      xacnhan:
        description: 'Gõ CHEP để chép thật các tài khoản đã duyệt bên Duyệt Chi sang PVA-379 (không đè ai đã có). Để trống = chạy thử, chỉ đếm.'
        required: false
        default: ''

concurrency:
  group: chep-vai-tu-duyet-chi
  cancel-in-progress: false

jobs:
  chep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cai firebase-tools
        run: npm install -g firebase-tools@13
      - name: Kiem tra da co chia khoa chua
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ] && [ "$HAS_SA" != "true" ]; then
            echo "::error::Chua co chia khoa FIREBASE_TOKEN (lay bang LAY-KHOA-TU-DONG.bat) trong GitHub → Settings → Secrets → Actions."
            exit 1
          fi
      - name: Chep tai khoan
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          XACNHAN: ${{ github.event.inputs.xacnhan }}
        run: |
          if [ "$HAS_SA" = "true" ]; then
            printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
            unset FIREBASE_TOKEN
          fi
          if [ "$XACNHAN" = "CHEP" ]; then
            node scripts/chep-vai-tu-duyet-chi.js --chep
          else
            echo "Chua go CHEP → chi chay thu (dem, khong ghi)."
            node scripts/chep-vai-tu-duyet-chi.js
          fi
          rm -f "$RUNNER_TEMP/sa.json"
