# RÀ KHOẢN GHI TRÙNG sổ quỹ PVA-379 + xoá đúng bản thừa theo mã — chạy TAY khi D bảo.
# lenh = "ra" (mặc định, chỉ đọc) | "xoa-khoan" (ids = ID1,ID2) | "bo-lan-chuyen" (ids = PID:IDX,...). Nhật ký không in nội dung / người.
name: Ra trung so quy PVA-379

on:
  workflow_dispatch:
    inputs:
      lenh:
        description: 'ra = rà trùng; so-tien = liệt kê mọi khoản/lần chuyển đúng số tiền (ids = số tiền); xoa-khoan = xoá khoản theo mã; bo-lan-chuyen = bỏ lần chuyển trên phiếu (PID:IDX)'
        required: true
        default: 'ra'
      ids:
        description: 'Danh sách mã, cách nhau dấu phẩy (chỉ dùng với xoa-khoan / bo-lan-chuyen)'
        required: false
        default: ''

concurrency:
  group: ra-trung-so-quy
  cancel-in-progress: false

jobs:
  ra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cai firebase-tools
        run: npm install -g firebase-tools@13
      - name: Kiem tra chia khoa
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ] && [ "$HAS_SA" != "true" ]; then echo "::error::Chua co FIREBASE_TOKEN"; exit 1; fi
      - name: Chay
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LENH: ${{ github.event.inputs.lenh }}
          IDS: ${{ github.event.inputs.ids }}
        run: |
          if [ "$HAS_SA" = "true" ]; then printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"; export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"; unset FIREBASE_TOKEN; fi
          case "$LENH" in
            xoa-khoan) node scripts/ra-trung-so-quy.js --xoa-khoan "$IDS" ;;
            bo-lan-chuyen) node scripts/ra-trung-so-quy.js --bo-lan-chuyen "$IDS" ;;
            so-tien) node scripts/ra-trung-so-quy.js --so-tien "$IDS" ;;
            *) node scripts/ra-trung-so-quy.js ;;
          esac
          rm -f "$RUNNER_TEMP/sa.json"
